name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets & Sync Capacitor Android
        run: npm run build:apk

      - name: Grant Execute Permission for Gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Label-Lens-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Label Lens AI v1.1.0 (Official APK Release)"
          body: |
            ### 🔍 Label Lens AI v1.1.0 (Official Release)
            **Smart India Hackathon 2026 (Problem Statement 26034)**
            *Department of Consumer Affairs, MoCAF&PD, Government of India*

            #### 📱 Direct Android APK Download:
            Download **`app-debug.apk`** directly from the Assets below to install on your Android device.

            #### 🌐 Official Live Web Application:
            [https://alokxcreate.github.io/Label-Lens-AI/](https://alokxcreate.github.io/Label-Lens-AI/)
          files: android/app/build/outputs/apk/debug/app-debug.apk
        continue-on-error: true
